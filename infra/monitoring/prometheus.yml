# Prometheus for CDI-Adapter (backlog E10-S2; metrics: docs/metrics.md, alerts: docs/alerts.md).
# Runs on the same host as the services and listens on 127.0.0.1:9090 only (start_monitoring.sh).
# Retention (start_monitoring.sh) is 30 days: the _partial alert compares the last hour with a
# rolling 7-day baseline.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/cdi-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: cdi-webapp        # the web app's own loopback metrics port (CDI_METRICS_PORT)
    static_configs:
      - targets: ["127.0.0.1:9464"]
  - job_name: cdi-mlserve       # the model gateway (GPU)
    static_configs:
      - targets: ["127.0.0.1:8077"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
