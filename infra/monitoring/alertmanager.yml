# Alertmanager for CDI-Adapter (backlog E10-S2). Listens on 127.0.0.1:9093 only, no clustering
# (start_monitoring.sh). On-call responses: docs/alerts.md.
#
# Delivery: the web app asks this Alertmanager what is firing and shows it to the signed-in staff
# in a banner on every page (LS-S9 AC4, src/cdi_adapter/webapp/alerts.py, CDI_ALERTMANAGER_URL).
# A silence set here hides the alert there too. The clinic has not named an email, chat or pager,
# so `oncall` has no integration: nobody who is not at a screen is told. To page someone, add ONE
# integration under the receiver (email_configs / webhook_configs / ...), keeping any credential in
# the secrets store (docs/secrets.md), never in this file.
route:
  receiver: oncall
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers: [severity = "ticket"]   # a quality regression, not an outage: once a day
      receiver: oncall
      repeat_interval: 24h

receivers:
  - name: oncall
